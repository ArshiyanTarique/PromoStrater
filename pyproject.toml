[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sku-mapping-pipeline"
version = "0.1.0"
description = "Corporate-grade SKU Mapping Pipeline using RapidFuzz and LightGBM."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Arshiyan Tarique" }
]

dependencies = [
    "pandas",
    "numpy",
    "rapidfuzz",
    "scikit-learn==1.6.1",
    "lightgbm",
    "openpyxl",
    "joblib",
    "pyarrow",
    "PyYAML",
    "tqdm",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]
embedding = [
    "sentence-transformers>=3,<6",
]
dashboard = [
    "streamlit>=1.40,<2",
    "xlrd>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["sku_mapping*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
