data:
  flyer_path: ../Alkabeer_Export_Data_Clickflyer.csv
  master_path: ../Product_Master.xlsx
  gold_pairs_path: ../TrainingData/GOLD_TRAINING_PAIRS_v5_FINAL.csv
  processed_dir: ../data/processed

model:
  model_dir: ../models
  model_path: ../models/registry/matcher_ranked_v5_calibrated.joblib

output:
  output_dir: ../outputs

matching:
  category_other_min_score: 85.0
  category_other_min_margin: 12.0
  normal_min_score: 55.0
  pack_compatible_bonus: 4.0
  pack_unknown_penalty: -3.0
  high_score_threshold: 80.0
  high_margin_threshold: 8.0
  medium_score_threshold: 65.0
  medium_margin_threshold: 6.0
  auto_match_threshold: 0.95
  manual_review_threshold: 0.70

competitors:
  raw_score_floor: 60.0
  adjusted_score_floor: 65.0
  # 0 = no limit: every competitor clearing the floors is kept. Was 5, which
  # silently discarded ~99% of matches - CKSA alone had 100 qualifying
  # competitors and showed 5, several of them the same product from different
  # flyers. The dashboard detail lists scroll, so length is not a constraint.
  max_per_target: 0

runtime:
  random_seed: 42
  log_level: INFO
  output_encoding: utf-8-sig

training:
  train_fraction: 0.70
  validation_fraction: 0.15
  calibration_fraction: 0.15
  split_search_candidates: 256
  calibration_method: auto
  isotonic_min_rows: 2000
  isotonic_min_positive_rows: 400
  target_auto_precision: 0.995
  min_auto_match_rows: 100
  max_auto_match_false_positives: 0
  min_auto_precision_lower_bound: 0.95
  precision_confidence_level: 0.95
  min_calibration_rows: 500
  min_calibration_positive_rows: 75
  auto_threshold_min: 0.50
  auto_threshold_max: 0.999
  auto_threshold_steps: 100
  manual_threshold_min: 0.05
  manual_threshold_max: 0.90
  manual_threshold_steps: 18
  provenance_weights:
    human_audited: 1.50
    human_audited_contradiction: 1.50
    clickflyer_autolabel: 1.00
    clickflyer_autolabel_forced: 0.75
    synthetic: 0.60
    rule_generated: 0.50
    forced_or_contradiction: 1.25
    unknown: 0.50
  compatibility:
    python_major_minor: "3.13"
    lightgbm_major_minor: "4.7"
    sklearn_major_minor: "1.6"

retraining:
  minimum_new_gold_labels: 50
  recent_gold_holdout_count: 20
  include_silver: false
  baseline_weight_multiplier: 1.0
  gold_weight: 1.0
  silver_weight: 0.25
  pseudo_weight: 0.0
  operational_threshold: 0.85
  precision_tolerance: 0.01
  calibration_brier_tolerance: 0.01
  calibration_ece_tolerance: 0.02
  subgroup_precision_tolerance: 0.05
  coverage_tolerance: 0.02
  minimum_subgroup_rows: 20
  minimum_evaluation_rows: 20
  snapshot_directory: ../data/learning/training_snapshots
  challenger_directory: ../models/challengers
  comparison_report_directory: ../reports/model_comparisons

ml:
  mode: assisted
  model_id: ranked-v5-cal-20260810T100756Z-matcher
  auto_accept_threshold: 0.85
  require_registered_model: true
  apply_safety_overrides: true
  continue_shadow_monitoring: true

embedding:
    enabled: false
    backend: local_hashing
    model_name: sku-hashing-384
    model_version: sklearn-hashing-word-1-2-384-v2
    batch_size: 64
    device: cpu
    similarity_metric: cosine
    cache_embeddings: true
    cache_path: ../data/processed/embedding_cache.sqlite3
    max_sequence_length: 256
    pooling_strategy: mean
    normalize_vectors: true
    local_files_only: true
    text_construction_version: 2.0.0
    commercial_parser_version: 1.0.0
    retrieval_enabled: true
    retrieval_top_k: 5
    retrieval_offer_batch_size: 256

agreement:
  require_same_top_candidate: true
  lightgbm_auto_accept_threshold: 0.85
  allow_embedding_auto_accept: false
  minimum_embedding_similarity: null
  minimum_embedding_margin: null
  disagreement_route: llm_review
  weak_agreement_route: llm_review
  hard_conflict_route: manual_review

llm_review:
  enabled: false
  provider: ollama
  model: llama3.1:8b
  endpoint: http://localhost:11434
  timeout_seconds: 60
  maximum_candidates: 5
  temperature: 0
  minimum_accept_confidence: 0.85
  maximum_retries: 1
  fail_route: manual_review
  reject_all_route: manual_review
  cache_responses: true
  cache_path: ../data/processed/llm_review_cache.sqlite3

learning_store:
  enabled: true
  database_path: ../data/learning/sku_learning.db
  csv_export_directory: ../data/learning/exports
  questions_per_run: 5

dashboard:
  input_directory: ../data/dashboard_uploads
  output_directory: ../outputs/dashboard_runs
  max_upload_size_mb: 100
  allowed_extensions:
    - csv
    - xlsx
    - xls

shadow_mode:
  enabled: false
  model_id: null
  package_reference: null
  registry_path: ../models/model_registry.json
  output_directory: ../outputs/shadow
  review_staging_directory: ../data/review_staging
  challenge_set_directory: ../data/challenge_sets
  retain_all_candidates: true
  require_package_status: SHADOW_MODE_ONLY
  top_k: 5
  # Own-brand offers processed per streaming chunk. 0 restores the legacy
  # all-at-once execution. Execution only - results are identical either way.
  # Smaller values give more frequent progress updates on the dashboard.
  chunk_size: 10000
  sampling_counts:
    highest_shadow_probabilities: 10
    near_diagnostic_threshold: 10
    production_shadow_disagreement: 10
    mixed_protein_offers: 8
    pack_format_conflicts: 8
    missing_measurements: 8
    underrepresented_families: 8
    candidate_rank_greater_than_one: 8
    difficult_families: 10
    random_production_baseline: 10
    likely_hard_negatives: 10
