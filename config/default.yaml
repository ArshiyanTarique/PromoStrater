data:
  flyer_path: ../Alkabeer_Export_Data_Clickflyer.csv
  master_path: ../Product_Master.xlsx
  gold_pairs_path: ../TrainingData/GOLD_TRAINING_PAIRS_v5_FINAL.csv
  processed_dir: ../data/processed

model:
  model_dir: ../models
  model_path: ../models/alkabeer_sku_matcher_v1.joblib

output:
  output_dir: ../outputs

matching:
  category_other_min_score: 85.0
  category_other_min_margin: 12.0
  normal_min_score: 55.0
  pack_compatible_bonus: 4.0
  pack_unknown_penalty: -3.0
  high_score_threshold: 80.0
  high_margin_threshold: 8.0
  medium_score_threshold: 65.0
  medium_margin_threshold: 6.0
  auto_match_threshold: 0.95
  manual_review_threshold: 0.70

competitors:
  raw_score_floor: 60.0
  adjusted_score_floor: 65.0
  max_per_target: 5

runtime:
  random_seed: 42
  log_level: INFO
  output_encoding: utf-8-sig
