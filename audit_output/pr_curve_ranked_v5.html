  const byThreshold = new Map();
  for (const s of series) {
    for (const p of (s.d.ops || [])) {
      if (!byThreshold.has(p.threshold)) byThreshold.set(p.threshold, []);
      byThreshold.get(p.threshold).push({ p, s });
    }
  }
  for (const t of [...byThreshold.keys()].sort((a, b) => b - a)) {
    for (const { p, s } of byThreshold.get(t)) {
      const tr = document.createElement("tr");
      const cells = ["≥ " + p.threshold.toFixed(2), p.name || "", p.where || "",
                     s.short, p.precision.toFixed(3), p.recall.toFixed(3),
                     String(p.n_flagged)];
      cells.forEach((c, i) => {
        const td = document.createElement("td");
        if (i >= 1 && i <= 3) td.className = "series-cell";
        td.textContent = c;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    }
  }

  const fn = document.getElementById("footnote");
  fn.textContent =
    "CV curve: pooled out-of-fold scores, family-grouped 5-fold CV over " +
    DATA.cv.n_pairs.toLocaleString() + " offer–SKU pairs (" + DATA.cv.n_pos.toLocaleString() +
    " positives), gold candidates injected — same protocol as the reported cv_pr_auc, " +
    "so it measures the classifier with the right answer always available. " +
    "Tail curve: matcher_ranked_v5.joblib scored on the 29-offer held-out tail — " +
    DATA.tail.n_pairs.toLocaleString() + " pairs, " + DATA.tail.n_pos.toLocaleString() +
    " positives, retrieval-only with no gold injection" +
    (DATA.tail.hit1 != null ? " (Hit@1 " + DATA.tail.hit1.toFixed(3) + ")" : "") +
    ", so a retrieval miss counts against it. The tail is the honest estimate; " +
    "with only " + DATA.tail.n_pos + " positives it carries a wide error bar. " +
    "Dots mark every cutoff currently live in the system, on both curves — " +
    (DATA.thresholds || []).map(t => t.t.toFixed(2) + " " + t.name + ", set in " + t.where).join("; ") + ".";
})();
</script>
